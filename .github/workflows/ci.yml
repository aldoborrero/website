name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Formatting (treefmt), tfsec and the devshell build.
      - name: Run flake check
        run: nix flake check --print-build-logs

  # Builds the site and deploys it to the Cloudflare Worker: production on
  # main, a preview version (pr-<number>) on pull requests.
  # Disabled until the site builds again (blog engine choice pending): set the
  # repository variable DEPLOY_ENABLED=true to turn it on.
  deploy:
    name: Deploy
    needs: check
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build site
        run: nix develop --command just build

      - name: Deploy to production
        if: github.event_name == 'push'
        run: nix develop --command just deploy

      - name: Upload preview
        if: github.event_name == 'pull_request'
        run: nix develop --command just preview pr-${{ github.event.pull_request.number }}
