# aldoborrero.com: Hugo with the theme in this directory (layouts/, assets/),
# no Go modules, so a build needs nothing but the hugo binary.
baseURL = "https://aldoborrero.com/"
title = "Aldo Borrero"
locale = "en"
enableInlineShortcodes = true
enableRobotsTXT = false
# Tag pages keep the tag as written (#nix, not #Nix).
capitalizeListTitles = false

[params]
# Default colour palette: the id of one of the palettes in assets/css/tokens.css.
# Readers can switch in the "Aa" panel; share images always use this one, light.
palette = "medianoche"
author = "Aldo Borrero"
description = "Aldo Borrero's blog: long posts about Nix and reproducible infrastructure."
github = "aldoborrero"
mastodon = "https://fosstodon.org/@aldo"
twitter = "aldoborrero"
# Follow links, shown in the follow list once set (undecided):
# bluesky = "https://bsky.app/profile/<handle>"
# linkedin = "https://www.linkedin.com/in/<handle>"

[taxonomies]
tag = "tags"

[permalinks.page]
# Production URLs. Each entry freezes :slug in its front matter, so renaming
# the file never moves the page. Every type uses the same dated shape.
posts = "/posts/:year/:month/:day/:slug/"
til = "/til/:year/:month/:day/:slug/"
notes = "/notes/:year/:month/:day/:slug/"
links = "/links/:year/:month/:day/:slug/"
quotes = "/quotes/:year/:month/:day/:slug/"

[pagination]
pagerSize = 100

# RSS stays at every index.xml existing readers use; Atom sits beside it at
# atom.xml. Both carry full text.
[mediaTypes."application/atom+xml"]
suffixes = ["xml"]

[outputFormats.atom]
mediaType = "application/atom+xml"
baseName = "atom"
rel = "alternate"
isPlainText = false

[outputs]
home = ["html", "rss", "atom"]
section = ["html", "rss", "atom"]
taxonomy = ["html"]
term = ["html", "rss", "atom"]
page = ["html"]

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.parser]
# Lets the image render hook see a standalone image and emit a <figure>.
wrapStandAloneImageWithinParagraph = false

[markup.highlight]
# Chroma CSS classes instead of inline styles, so colours come from the tokens.
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[sitemap]
changeFreq = ""
priority = -1

# Lets Markdown images opt out of the viewer with {.nozoom} on the next line.
[markup.goldmark.parser.attribute]
block = true

# static/images is also an asset source, so the image render hook can read
# dimensions and publish a downscaled copy of large images.
[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "static/images"
target = "assets/images"

[[module.mounts]]
source = "static"
target = "static"
