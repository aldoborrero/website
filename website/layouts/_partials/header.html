{{- $here := . }}
<header class="site-head">
  <div class="row">
    <a class="brand" href="/">{{ site.Title }}</a>
    <nav class="site-nav" aria-label="Main">
      {{- $writing := or (eq .Section "posts") (eq .RelPermalink "/posts/") }}
      <a href="/posts/"{{ if eq .RelPermalink "/posts/" }} aria-current="page"{{ else if $writing }} aria-current="true"{{ end }}>Writing</a>
      <a href="/about/"{{ if eq .RelPermalink "/about/" }} aria-current="page"{{ end }}>About</a>
      <a href="/index.xml">Feed</a>
    </nav>
    <button type="button" class="theme-toggle" hidden>
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></svg>
    </button>
    <script>
      (function () {
        var root = document.documentElement;
        var btn = document.currentScript.previousElementSibling;
        var meta = document.querySelector('meta[name="theme-color"]');
        function sync() {
          var dark = root.dataset.theme === "dark";
          btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
          if (meta) meta.content = getComputedStyle(root).getPropertyValue("--bg").trim();
        }
        btn.addEventListener("click", function () {
          var dark = root.dataset.theme !== "dark";
          if (dark) root.dataset.theme = "dark"; else delete root.dataset.theme;
          try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
          sync();
        });
        sync();
        btn.hidden = false;
      })();
    </script>
  </div>
</header>
