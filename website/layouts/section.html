{{ define "main" }}
<header class="archive-head row">
  <div></div>
  <div>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
    {{ partial "feeds.html" . }}
  </div>
</header>
{{- $pager := .Paginate .RegularPages 20 }}
<div class="row">
  <div></div>
  <div>
    {{- with $pager.Pages }}{{ partial "stream.html" . }}{{ else }}<p class="empty">Nothing here yet.</p>{{ end }}
    {{ partial "pager.html" $pager }}
  </div>
</div>
{{ end }}
